<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="img/64.png" rel="shortcut icon" />
    <link rel="icon" type="image/png" href="img/64.png" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />

    <title>Sign in</title>
    <meta name="robots" content="noindex" />
    <script>
      try {
        var t = localStorage.getItem('ran-theme');
        if (t === 'dark' || t === 'light') {
          document.documentElement.setAttribute('data-ran-theme', t);
          document.documentElement.setAttribute('theme', t);
        }
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="/ran-fonts/fonts.css" />
    <link rel="stylesheet" href="/ran-tokens.css" />
    <link rel="stylesheet" href="/brand-tokens.css" />
    <link rel="stylesheet" href="/landing.css" />
    <script src="/ranui-iife/popover.iife.js" defer></script>
    <script src="/ranui-iife/content.iife.js" defer></script>
    <script src="/lang-switch.js" defer></script>
    <script src="/theme-toggle.js" defer></script>
  </head>

  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <symbol id="gh-mark" viewBox="0 0 16 16">
        <path
          fill="currentColor"
          d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"
        />
      </symbol>
    </svg>

    <header class="bar">
      <a class="brand" href="/"><span class="wordmark">EditXLSX</span></a>
      <nav>
        <r-popover class="lang-menu" placement="bottom" trigger="click" role="button" aria-label="Language">
          <span class="lang-trigger">
            <svg class="langmark" aria-hidden="true" viewBox="0 0 24 24">
                <path d="m5 8 6 6" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
                <path d="m4 14 6-6 2-3" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
                <path d="M2 5h12" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" />
                <path d="M7 2h1" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" />
                <path d="m22 22-5-10-5 10" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
                <path d="M14 18h6" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" />
              </svg>
                          <svg class="menu-caret" aria-hidden="true" viewBox="0 0 24 24">
              <path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            </span>
          <r-content>
            <div class="lang-list">
              <a class="lang-option" href="/login?locale=de" lang="de" hreflang="de">Deutsch</a>
              <a class="lang-option is-current" href="/login?locale=en" lang="en" hreflang="en" aria-current="page"
                >English</a
              >
              <a class="lang-option" href="/login?locale=es" lang="es" hreflang="es">Español</a>
              <a class="lang-option" href="/login?locale=pt" lang="pt" hreflang="pt">Português</a>
              <a class="lang-option" href="/login?locale=zh-CN" lang="zh-CN" hreflang="zh-CN">中文</a>
              <a class="lang-option" href="/login?locale=ja" lang="ja" hreflang="ja">日本語</a>
              <a class="lang-option" href="/login?locale=ko" lang="ko" hreflang="ko">한국어</a>
            </div>
          </r-content>
        </r-popover>
        <r-popover class="theme-menu" placement="bottom" trigger="click" role="button" aria-label="Theme">
          <span class="theme-trigger">
            <svg class="thememark" data-theme-icon aria-hidden="true" viewBox="0 0 24 24">
              <path
                d="M4 5h16v10a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5zM8 19h8M12 16v3"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
                          <svg class="menu-caret" aria-hidden="true" viewBox="0 0 24 24">
              <path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            </span>
          <r-content>
            <div class="theme-list" role="listbox" aria-label="Theme">
              <button type="button" class="theme-option" role="option" data-theme="system">
                <svg class="theme-option-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 5h16v10a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5zM8 19h8M12 16v3" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" /></svg>
                <span>System</span>
              </button>
              <button type="button" class="theme-option" role="option" data-theme="light">
                <svg class="theme-option-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3v2M12 19v2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M3 12h2M19 12h2M5.6 18.4l1.4-1.4M17 7l1.4-1.4M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" /></svg>
                <span>Light</span>
              </button>
              <button type="button" class="theme-option" role="option" data-theme="dark">
                <svg class="theme-option-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M21 14.3A8.5 8.5 0 1 1 9.7 3a7 7 0 0 0 11.3 11.3z" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" /></svg>
                <span>Dark</span>
              </button>
            </div>
          </r-content>
        </r-popover>
      </nav>
    </header>

    <main id="auth-root"></main>

    <noscript>
      <p style="max-width: 720px; margin: 0 auto; padding: 24px; font-family: system-ui, sans-serif">
        This page needs JavaScript to sign in.
      </p>
    </noscript>
  </body>
  <script type="module" src="./lib/auth-page.ts"></script>
</html>
