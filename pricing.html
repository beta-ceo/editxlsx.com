<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="img/64.png" rel="shortcut icon" />
    <link rel="icon" type="image/png" href="img/64.png" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />

    <title>Pricing — EditXLSX cloud storage</title>
    <meta
      name="description"
      content="EditXLSX pricing: free local library in this browser. Optional cloud storage $5/year · 1 GB or $10/year · 10 GB."
    />
    <link rel="canonical" href="https://editxlsx.com/pricing" />
    <script>
      try {
        var t = localStorage.getItem('ran-theme');
        if (t === 'dark' || t === 'light') {
          document.documentElement.setAttribute('data-ran-theme', t);
          document.documentElement.setAttribute('theme', t);
        }
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="/ran-fonts/fonts.css" />
    <link rel="stylesheet" href="/ran-tokens.css" />
    <link rel="stylesheet" href="/brand-tokens.css" />
    <link rel="stylesheet" href="/landing.css" />
    <script src="/ranui-iife/button.iife.js" defer></script>
    <script src="/ranui-iife/popover.iife.js" defer></script>
    <script src="/ranui-iife/content.iife.js" defer></script>
    <script src="/lang-switch.js" defer></script>
    <script src="/theme-toggle.js" defer></script>
  </head>

  <body class="pricing-page">
    <header class="bar">
      <div class="bar-inner">
        <a class="brand" href="/"
          ><span class="mark" aria-hidden="true"></span><span class="wordmark">EditXLSX</span></a
        >
        <nav class="products" aria-label="Products">
          <a class="navlink" href="/">Home</a>
          <a class="navlink" href="/#features">Features</a>
          <a class="navlink" href="/#essentials">For you</a>
          <a class="navlink" href="/#pricing">Pricing</a>
          <a class="navlink" href="/help">Help</a>
        </nav>
        <nav class="utils" aria-label="Account">
          <r-popover class="lang-menu" placement="bottom" trigger="click" role="button" aria-label="Language">
            <span class="lang-trigger">
              <svg class="langmark" aria-hidden="true" viewBox="0 0 24 24">
                <path d="m5 8 6 6" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
                <path d="m4 14 6-6 2-3" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
                <path d="M2 5h12" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" />
                <path d="M7 2h1" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" />
                <path d="m22 22-5-10-5 10" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
                <path d="M14 18h6" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" />
              </svg>
                            <svg class="menu-caret" aria-hidden="true" viewBox="0 0 24 24">
                <path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </span>
            <r-content>
              <div class="lang-list">
                <a class="lang-option" href="/pricing?locale=de" lang="de" hreflang="de"><span class="lang-option-icon" aria-hidden="true">DE</span><span>Deutsch</span></a>
                <a
                  class="lang-option is-current"
                  href="/pricing?locale=en"
                  lang="en"
                  hreflang="en"
                  aria-current="page"
                  ><span class="lang-option-icon" aria-hidden="true">EN</span><span>English</span></a
                >
                <a class="lang-option" href="/pricing?locale=es" lang="es" hreflang="es"><span class="lang-option-icon" aria-hidden="true">ES</span><span>Español</span></a>
                <a class="lang-option" href="/pricing?locale=pt" lang="pt" hreflang="pt"><span class="lang-option-icon" aria-hidden="true">PT</span><span>Português</span></a>
                <a class="lang-option" href="/pricing?locale=zh-CN" lang="zh-CN" hreflang="zh-CN"><span class="lang-option-icon" aria-hidden="true">中</span><span>中文</span></a>
                <a class="lang-option" href="/pricing?locale=ja" lang="ja" hreflang="ja"><span class="lang-option-icon" aria-hidden="true">あ</span><span>日本語</span></a>

            </r-content>
          </r-popover>
          <r-popover class="theme-menu" placement="bottom" trigger="click" role="button" aria-label="Theme">
            <span class="theme-trigger">
              <svg class="thememark" data-theme-icon aria-hidden="true" viewBox="0 0 24 24">
                <path
                  d="M4 5h16v10a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5zM8 19h8M12 16v3"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.75"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
                            <svg class="menu-caret" aria-hidden="true" viewBox="0 0 24 24">
                <path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </span>
            <r-content>
              <div class="theme-list" role="listbox" aria-label="Theme">
                <button type="button" class="theme-option" role="option" data-theme="system">
                  <svg class="theme-option-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 5h16v10a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5zM8 19h8M12 16v3" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" /></svg>
                  <span>System</span>
                </button>
                <button type="button" class="theme-option" role="option" data-theme="light">
                  <svg class="theme-option-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3v2M12 19v2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M3 12h2M19 12h2M5.6 18.4l1.4-1.4M17 7l1.4-1.4M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" /></svg>
                  <span>Light</span>
                </button>
                <button type="button" class="theme-option" role="option" data-theme="dark">
                  <svg class="theme-option-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M21 14.3A8.5 8.5 0 1 1 9.7 3a7 7 0 0 0 11.3 11.3z" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" /></svg>
                  <span>Dark</span>
                </button>
              </div>
            </r-content>
          </r-popover>
          <a class="nav-login" href="/login">Log in</a>
          <a class="nav-cta" href="/workspace"><r-button type="primary">Open workspace</r-button></a>
        </nav>
      </div>
    </header>

    <main id="pricing-root" class="pricing-shell" aria-busy="true">
      <div class="pricing-skel" aria-hidden="true">
        <div class="pricing-skel-badge"></div>
        <div class="pricing-skel-title"></div>
        <div class="pricing-skel-lead"></div>
        <div class="pricing-skel-grid">
          <div></div>
          <div></div>
          <div></div>
        </div>
      </div>

    <footer class="pricing-foot">
      <div class="pricing-foot-inner">
        <a class="brand" href="/"
          ><span class="mark" aria-hidden="true"></span><span class="wordmark">EditXLSX</span></a
        >
        <p>Free local library in this browser. Optional cloud storage when a workbook needs to follow you.</p>
        <nav aria-label="Footer">
          <a href="/workspace">Workspace</a>
          <a href="/help">Help</a>
          <a href="/about">About</a>
          <a href="/">Home</a>
        </nav>
      </div>
    </footer>

      <p class="pricing-noscript">
        This page needs JavaScript to start checkout. Cloud plans: $5/year · 1 GB or $10/year · 10 GB.
        Local library in this browser stays free.

  <script type="module" src="./lib/pricing-page.ts"></script>
</html>
