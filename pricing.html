<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="img/64.png" rel="shortcut icon" />
    <link rel="icon" type="image/png" href="img/64.png" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />

    <title>Pricing — EditXLSX cloud storage</title>
    <meta
      name="description"
      content="EditXLSX pricing: free local library in this browser. Optional cloud storage $5/year · 1 GB or $10/year · 10 GB."
    />
    <link rel="canonical" href="https://editxlsx.com/pricing" />
    <script>
      try {
        var t = localStorage.getItem('ran-theme');
        if (t === 'dark' || t === 'light') {
          document.documentElement.setAttribute('data-ran-theme', t);
          document.documentElement.setAttribute('theme', t);
        }
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="/ran-fonts/fonts.css" />
    <link rel="stylesheet" href="/ran-tokens.css" />
    <link rel="stylesheet" href="/brand-tokens.css" />
    <link rel="stylesheet" href="/landing.css" />
    <script src="/ranui-iife/button.iife.js" defer></script>
    <script src="/ranui-iife/popover.iife.js" defer></script>
    <script src="/ranui-iife/content.iife.js" defer></script>
    <script src="/ranui-iife/theme-switch.iife.js" defer></script>
    <script src="/lang-switch.js" defer></script>
  </head>

  <body class="pricing-page">
    <header class="bar">
      <div class="bar-inner">
        <a class="brand" href="/"
          ><span class="mark" aria-hidden="true"></span><span class="wordmark">EditXLSX</span></a
        >
        <nav class="products" aria-label="Product">
          <a class="navlink" href="/#features">Features</a>
          <a class="navlink" href="/workspace">Workspace</a>
          <a class="navlink" href="/pricing" aria-current="page">Pricing</a>
          <a class="navlink" href="/help">Help</a>
        </nav>
        <nav class="utils" aria-label="Account">
          <r-popover class="lang-menu" placement="bottom" trigger="click" role="button" aria-label="Language">
            <span class="lang-trigger">
              <svg class="langmark" aria-hidden="true" viewBox="0 0 16 16">
                <path
                  d="M1.75 12.5 4.25 4.75 6.75 12.5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.4"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <path d="M2.7 9.85h3.1" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
                <path
                  d="M9 4.5h5.5M11.75 4.5v7.75M9.25 8.15h5M9.4 12.25h4.7"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.35"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </span>
            <r-content>
              <div class="lang-list">
                <a class="lang-option" href="/pricing?locale=de" lang="de" hreflang="de">Deutsch</a>
                <a
                  class="lang-option is-current"
                  href="/pricing?locale=en"
                  lang="en"
                  hreflang="en"
                  aria-current="page"
                  >English</a
                >
                <a class="lang-option" href="/pricing?locale=es" lang="es" hreflang="es">Español</a>
                <a class="lang-option" href="/pricing?locale=pt" lang="pt" hreflang="pt">Português</a>
                <a class="lang-option" href="/pricing?locale=zh-CN" lang="zh-CN" hreflang="zh-CN">中文</a>
                <a class="lang-option" href="/pricing?locale=ja" lang="ja" hreflang="ja">日本語</a>
                <a class="lang-option" href="/pricing?locale=ko" lang="ko" hreflang="ko">한국어</a>
              </div>
            </r-content>
          </r-popover>
          <r-theme-switch class="theme-switch" label="Theme"></r-theme-switch>
          <a class="nav-cta" href="/workspace"><r-button type="primary">Open workspace</r-button></a>
        </nav>
      </div>
    </header>

    <main id="pricing-root" class="pricing-shell" aria-busy="true">
      <div class="pricing-skel" aria-hidden="true">
        <div class="pricing-skel-badge"></div>
        <div class="pricing-skel-title"></div>
        <div class="pricing-skel-lead"></div>
        <div class="pricing-skel-grid">
          <div></div>
          <div></div>
          <div></div>
        </div>
      </div>
    </main>

    <footer class="pricing-foot">
      <div class="pricing-foot-inner">
        <a class="brand" href="/"
          ><span class="mark" aria-hidden="true"></span><span class="wordmark">EditXLSX</span></a
        >
        <p>Free local library in this browser. Optional cloud storage when a workbook needs to follow you.</p>
        <nav aria-label="Footer">
          <a href="/workspace">Workspace</a>
          <a href="/help">Help</a>
          <a href="/about">About</a>
          <a href="/">Home</a>
        </nav>
      </div>
    </footer>

    <noscript>
      <p class="pricing-noscript">
        This page needs JavaScript to start checkout. Cloud plans: $5/year · 1 GB or $10/year · 10 GB.
        Local library in this browser stays free.
      </p>
    </noscript>
  </body>
  <script type="module" src="./lib/pricing-page.ts"></script>
</html>
